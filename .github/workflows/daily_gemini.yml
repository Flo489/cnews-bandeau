name: Analyse quotidienne Gemini

on:
  schedule:
    # Une fois par jour a 23h30 UTC (00h30 heure de Paris en hiver / 01h30 en ete)
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generer les statistiques et l'analyse Gemini du jour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          SHEETS_WEBHOOK_SECRET: ${{ secrets.SHEETS_WEBHOOK_SECRET }}
          TIMEZONE: Europe/Paris
        run: |
          python -m src.main --analyze-daily

      - name: Publier les statistiques mises a jour sur GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: bilan quotidien Gemini [skip ci]"
            git push
          fi
