[project]
name = "cnews-bandeau-analyzer"
version = "0.1.0"
description = "Capture, filtrage anti-publicite, OCR et analyse statistique quotidienne des bandeaux CNews."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "rapidocr>=3.0",
    "requests>=2.32",
    "tzdata>=2024.1",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
